  <script>
    // ======================================================
    // MULTI-PAYLOAD LOGIN WITH P2/P3 DIFFICULTY
    // ======================================================
    
    // CONFIGURATION
    const PAYLOAD_FILES = ['9702payload.enc', '9702payload1.enc'];
    const UPDATES_FILE = 'updates.json';
    const MCQ_LEVELS_FILE = 'MCQ.json';
    const P2P3_FILE = 'P2P3.json';
    let PDF_FOLDER = '';
    let ENCRYPTED_TEXT = '';
    let currentPayload = '';
    let debugMessages = [];
    let debugVisible = false;
    let toastTimeout = null;
    let debugEnabled = false;
    let globalAllData = [];

    const statusEl = document.getElementById('status-msg');
    const errorEl = document.getElementById('error-msg');
    const debugConsole = document.getElementById('debug-console');
    const debugContent = document.getElementById('debug-content');
    const debugClose = document.getElementById('debug-close');
    const debugHint = document.getElementById('debug-hint');
    const toastContainer = document.getElementById('toast-container');
    const logoutBtn = document.getElementById('logout-btn');

    // Tooltip elements
    const tooltip = document.getElementById('difficulty-tooltip');
    const tooltipFilename = document.getElementById('tooltip-filename');
    const tooltipDiffBadge = document.getElementById('tooltip-diff-badge');
    const tooltipContent = document.getElementById('tooltip-content');

    document.addEventListener('keydown', (e) => {

    // 1. LOAD PAYLOAD WITH RETRY
    async function loadPayloadWithRetry(payloadFile, retries = 3) {
      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          const res = await fetch(payloadFile);
          if (res.status === 429) {
            console.warn(`Rate limited (429). Attempt ${attempt}/${retries}. Waiting 2s...`);
            await new Promise(resolve => setTimeout(resolve, 2000));
            continue;
          }
          if (res.status === 404) {
            return null; // File doesn't exist
          }
          if (!res.ok) throw new Error(`Fetch Failed: ${res.status} ${res.statusText}`);
          const text = await res.text();
          if (!text || text.length === 0) throw new Error(`${payloadFile} is EMPTY.`);
          return text;
        } catch (err) {
          if (attempt === retries) throw err;
          console.warn(`Attempt ${attempt} failed for ${payloadFile}. Retrying...`);
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
      }
    }

    // 2. DECRYPT PAYLOAD
    function decryptPayload(encryptedText, password) {
      try {
        const bytes = CryptoJS.AES.decrypt(encryptedText, password);
        if (bytes.sigBytes < 0) return null;
        let decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
        if (!decryptedStr) return null;
        return JSON.parse(decryptedStr);
      } catch (e) {
        return null;
      }
    }

    // 3. UNLOCK FUNCTION - Try both payload files
    function unlock(isAuto = false) {
      const passInput = document.getElementById('pass-input');
      const pass = passInput.value;
      
      if (!pass) {
        if(!isAuto) logError("Please enter a password.");
        return;
      }

      if (!isAuto) updateStatus("Decrypting...");
      const loginBtn = document.querySelector('#login-screen button');
      if (loginBtn) loginBtn.disabled = true;

      // Try each payload file
      const loadPromises = PAYLOAD_FILES.map(file => 
        loadPayloadWithRetry(file)
          .then(encryptedText => {
            if (!encryptedText) {
              debugLog(`ℹ️ ${file} not found, skipping...`);
              return null;
            }
            const bundle = decryptPayload(encryptedText, pass);
            if (bundle) {
              debugLog(`✅ Successfully decrypted ${file}`);
              return { file, bundle, encryptedText };
            } else {
              debugLog(`❌ Failed to decrypt ${file} with provided password`);
              return null;
            }
          })
          .catch(err => {
            debugLog(`❌ Error loading ${file}: ${err.message}`);
            return null;
          })
      );

      Promise.all(loadPromises)
        .then(results => {
          const success = results.find(r => r !== null);
          
          if (!success) {
            if (isAuto) {
              sessionStorage.removeItem('physics_session_key');
              passInput.value = '';
              updateStatus("Session expired. Please login.");
            } else {
              logError("Incorrect password. Please try again.");
              passInput.classList.add('error');
              passInput.value = '';
            }
            if (loginBtn) loginBtn.disabled = false;
            return;
          }

          const { file, bundle, encryptedText } = success;
          ENCRYPTED_TEXT = encryptedText;
          currentPayload = file;
          
          sessionStorage.setItem('physics_session_key', pass);
          sessionStorage.setItem('physics_payload', file);
          
          PDF_FOLDER = bundle.secure_folder;
          let mainData = bundle.data;
          
          debugLog(`📁 PDF_FOLDER: ${PDF_FOLDER} (from ${file})`);

          updateStatus("Checking for updates...");
          fetch(UPDATES_FILE)
            .then(res => {
              if (res.status === 404) return [];
              if (!res.ok) throw new Error("Update check failed");
              return res.json();
            })
            .then(updateData => {
              if(Array.isArray(updateData) && updateData.length > 0) {
                debugLog(`Merging ${updateData.length} new items`);
                mainData = mainData.concat(updateData);
              }
              
              globalAllData = mainData;
              
              updateStatus("Launching app...");
              finishAppLaunch(mainData);
              
              // Load MCQ levels
              updateStatus("Loading MCQ levels in background...");
              loadMCQLevels().then(levelData => {
                if (levelData && Array.isArray(levelData) && levelData.length > 0) {
                  const levelMap = {};
                  levelData.forEach(item => {
                    if (item.filename && item.level) {
                      const levelStr = String(item.level);
                      levelMap[item.filename] = levelStr;
                    }
                  });
                  debugLog(`✅ Loaded ${Object.keys(levelMap).length} MCQ level mappings`);
                  
                  const updatedData = mainData.map(item => {
                    const level = levelMap[item.filename] || '';
                    return { ...item, level: level };
                  });
                  
                  showToast(`Loaded ${Object.keys(levelMap).length} MCQ level mappings`, 'success', 3000);
                  updateAppWithLevels(updatedData);
                }
              });
              
              // Load P2/P3 difficulty data
              updateStatus("Loading P2/P3 difficulty data in background...");
              loadP2P3Data().then(p2p3Data => {
                if (p2p3Data && Array.isArray(p2p3Data) && p2p3Data.length > 0) {
                  const diffMap = {};
                  p2p3Data.forEach(item => {
                    if (item.filename) {
                      diffMap[item.filename] = {
                        parts: item.parts || [],
                        total_marks: item.total_marks || 0,
                        weighted_sum: item.weighted_sum || 0,
                        overall_difficulty: item.overall_difficulty || 0
                      };
                    }
                  });
                  debugLog(`✅ Loaded ${Object.keys(diffMap).length} P2/P3 difficulty mappings`);
                  
                  if (appInstance && appInstance.updateP2P3Data) {
                    appInstance.updateP2P3Data(diffMap);
                  }
                  
                  showToast(`Loaded ${Object.keys(diffMap).length} P2/P3 difficulty entries`, 'success', 3000);
                }
              });
              
              if (loginBtn) loginBtn.disabled = false;
              logoutBtn.style.display = 'flex';
            })
            .catch(err => {
              console.warn("Update fetch error:", err);
              debugLog("Update fetch error: " + err.message);
              finishAppLaunch(mainData);
              if (loginBtn) loginBtn.disabled = false;
              logoutBtn.style.display = 'flex';
            });
        })
        .catch(err => {
          if (isAuto) {
            sessionStorage.removeItem('physics_session_key');
            passInput.value = '';
            updateStatus("Session expired. Please login.");
          } else {
            logError("Error: " + err.message);
          }
          if (loginBtn) loginBtn.disabled = false;
        });
    }

    // Load MCQ levels with AbortController
    async function loadMCQLevels() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2000);
      
      try {
        debugLog(`🔍 Attempting to load ${MCQ_LEVELS_FILE}...`);
        
        const res = await fetch(MCQ_LEVELS_FILE, { 
          signal: controller.signal 
        });
        
        clearTimeout(timeoutId);
        
        if (res.status === 404) {
          debugLog('⚠️ MCQ.json not found - continuing without level filter');
          return null;
        }
        
        if (!res.ok) {
          debugLog(`❌ Failed to load MCQ.json: ${res.status}`);
          return null;
        }
        
        const data = await res.json();
        debugLog(`📊 Loaded ${data.length} level mappings from MCQ.json`);
        
        if (data.length > 0) {
          debugLog(`📝 Sample: ${JSON.stringify(data.slice(0, 2))}`);
        }
        
        return data;
      } catch (err) {
        if (err.name === 'AbortError') {
          debugLog('⏱️ MCQ.json loading timed out (2s) - continuing without level filter');
        } else {
          debugLog(`❌ Error loading MCQ.json: ${err.message}`);
        }
        return null;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    // ---- START APP with pagination and selection set ----
    function startApp(allData) {

      let totalPages = 1;
      let msEnabled = false;

      debugLog(`📁 PDF_FOLDER: ${PDF_FOLDER}`);

      let processedData = allData.map(item => {
        let q = (item.question || '').trim();
        q = q.replace(/\.pdf$/i, '').replace(/^q0+(\d)/i, 'q$1');
        return {
          filename: (item.filename || '').trim(),
          year: (item.year || '').trim(),
          paper: (item.paper || '').trim(),
          question: q,
          mainTopic: (item.mainTopic || '').trim(),
          otherTopics: Array.isArray(item.otherTopics)
            ? item.otherTopics.map(t => t.trim()).filter(t => t !== "")
            : [],
          level: (item.level || '').trim()
        };
      });

      let currentFilteredData = [...processedData];
      let currentSort = { column: 1, asc: false };

      const headers = document.querySelectorAll('#data-table th');

      headers.forEach((th, index) => {
        th.addEventListener('click', () => {

          } else {

            currentSort.asc = false;
          }

      // Select All checkbox: toggle all visible rows
      selectAllCheckbox.addEventListener('change', function() {
        const isChecked = this.checked;
        const visibleRows = tableBody.querySelectorAll('tr');
        visibleRows.forEach(row => {
          const cb = row.querySelector('.row-checkbox');

      msToggle.addEventListener('change', function() {

      function loadMSFile(fname, baseUrl) {
        const msFile = getMSFilename(fname);
        const msUrl = baseUrl + msFile;
        fetch(msUrl, { method: 'HEAD' })
          .then(res => {
            if (res.ok) {
              msViewer.src = msUrl;

              msViewer.style.flex = '1';

          })

            pdfViewer.style.flex = '1';

              showToast(`⚠️ Mark scheme not available for: ${fname}`, 'warning', 4000);

          currentPage--;
          renderTable(currentFilteredData);

        if (currentPage < total) {
          currentPage++;

        }
      });

      function populateDropdowns(data) {
        const getUniques = (mapper, sorter) =>
          [...new Set(data.map(mapper).flat().filter(Boolean))].sort(sorter);

        const naturalSort = (a, b) =>
          a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

        const yearSort = (a, b) => {
          const numA = parseInt(a.replace(/\D/g, '')) || 0;
          const numB = parseInt(b.replace(/\D/g, '')) || 0;
          return numA !== numB ? numB - numA : b.localeCompare(a);
        };

        const topics = getUniques(i => i.mainTopic.split(/[;,]/).map(s => s.trim()), undefined);
        const years = getUniques(i => i.year, yearSort);
        const papers = getUniques(i => i.paper, undefined);
        const questions = getUniques(i => i.question, naturalSort);
        
        const levelOptions = [
          { value: '1', label: '1 Recall' },
          { value: '2', label: '2 Comprehension' },
          { value: '3', label: '3 Application' },
          { value: '4', label: '4 Analysis' },
          { value: '5', label: '5 Mastery/Synthesis' }
        ];

        const difficultyOptions = [
          { value: 'easy', label: 'Easy (< 2.5)' },
          { value: 'moderate', label: 'Moderate (< 3.0)' },
          { value: 'challenging', label: 'Challenging (< 3.5)' },
          { value: 'hard', label: 'Hard (< 4.0)' },
          { value: 'veryhard', label: 'Very Hard (≥ 4.0)' }
        ];

        const setupList = (id, arr, cls, isLevel = false, isDifficulty = false) => {
          const el = document.getElementById(id);
          if (!el) return;
          
          if (!isLevel && !isDifficulty) {
            el.innerHTML = '';
          } else {
            const label = el.querySelector('.dropdown-label');
            el.innerHTML = '';
            if (label) el.appendChild(label);
          }
          
          const items = isLevel ? levelOptions : (isDifficulty ? difficultyOptions : arr);
          
          items.forEach(v => {
            const l = document.createElement('label');
            const c = document.createElement('input');
            c.type = 'checkbox';
            c.className = cls;
            c.value = isLevel ? v.value : (isDifficulty ? v.value : v);
            l.appendChild(c);
            l.appendChild(document.createTextNode(' ' + (isLevel ? v.label : (isDifficulty ? v.label : v))));
            el.appendChild(l);
          });
        };

        setupList('topic-filter-list', topics, 'topic-checkbox');
        setupList('year-filter-list', years, 'year-checkbox');
        setupList('paper-filter-list', papers, 'paper-checkbox');
        setupList('question-filter-list', questions, 'question-checkbox');
        setupList('level-filter-list', [], 'level-checkbox', true);
        setupList('difficulty-filter-list', [], 'difficulty-checkbox', false, true);
      }

      function setupEventListeners(initialData) {
        const setup = (btnId, panelId, listId, applyId, set, cls) => {
          const btn = document.getElementById(btnId),
                panel = document.getElementById(panelId),
                list = document.getElementById(listId),
                apply = document.getElementById(applyId);
          if (!btn) return;
          
          btn.addEventListener('click', () => {
            hideTooltip();
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
          });
          
          apply.addEventListener('click', () => {
            set.clear();
            list.querySelectorAll(`.${cls}:checked`).forEach(b => set.add(b.value));
            const countSpan = btn.querySelector('span');
            if (countSpan) {
              countSpan.textContent = set.size;
            }
            panel.style.display = 'none';
            applyFilters(processedData);
          });
        };

        setup('year-filter-btn', 'year-filter-panel', 'year-filter-list', 'year-filter-apply', selectedYears, 'year-checkbox');
        setup('paper-filter-btn', 'paper-filter-panel', 'paper-filter-list', 'paper-filter-apply', selectedPapers, 'paper-checkbox');
        setup('question-filter-btn', 'question-filter-panel', 'question-filter-list', 'question-filter-apply', selectedQuestions, 'question-checkbox');
        setup('topic-filter-btn', 'topic-filter-panel', 'topic-filter-list', 'topic-filter-apply', selectedTopics, 'topic-checkbox');
        setup('level-filter-btn', 'level-filter-panel', 'level-filter-list', 'level-filter-apply', selectedLevels, 'level-checkbox');
        setup('difficulty-filter-btn', 'difficulty-filter-panel', 'difficulty-filter-list', 'difficulty-filter-apply', selectedDifficulties, 'difficulty-checkbox');

        document.addEventListener('click', (e) => {
          ['topic-filter-panel', 'year-filter-panel', 'paper-filter-panel', 'question-filter-panel', 'level-filter-panel', 'difficulty-filter-panel']
            .forEach(id => {
              const p = document.getElementById(id);
              if (p && !p.contains(e.target) && !e.target.closest('.filter-button'))
                p.style.display = 'none';
            });
        });

        // Hide tooltip when interacting with controls
        const controlElements = document.querySelectorAll('.filter-button, .tools-dropdown-btn, .nav-dropdown-btn, .logout-btn, .ms-toggle, .other-topics-toggle input, #select-all');
        controlElements.forEach(el => {
          el.addEventListener('click', hideTooltip);
          el.addEventListener('mouseenter', hideTooltip);
        });

        document.getElementById('pdf-viewer-container').addEventListener('click', hideTooltip);
        document.getElementById('lower-panel').addEventListener('click', hideTooltip);
        document.getElementById('dragger').addEventListener('mousedown', hideTooltip);

        document.getElementById('generate-html-btn').addEventListener('click', generateHTML);
        document.getElementById('merge-pdf-btn').addEventListener('click', mergePDFs);
        document.getElementById('download-zip-btn').addEventListener('click', downloadZIP);

        // ---- getSelectedRows uses the filename set ----
        function getSelectedRows() {
          return currentFilteredData.filter(item => selectedRowFilenames.has(item.filename));
        }

        async function generateHTML() {
          hideTooltip();
          const rows = getSelectedRows();
          if (rows.length === 0) {
            showToast("No files selected. Please check the boxes for files you want to include.", 'warning', 4000);
            return;
          }
          if (rows.length > 100 && !confirm(`Generate report for ${rows.length} files? Browser may crash due to large number of files. Safer to keep < 100 files.`))
            return;

          const pdfBaseUrl = `https://sialaichai.github.io/physics9702/${PDF_FOLDER}/`;
          let html = `<!DOCTYPE html><html><head><title>Report</title><style>body{font-family:sans-serif;margin:20px;background:#f4f4f4}h1{text-align:center}.pdf-section{margin-bottom:40px;background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.header-row{font-size:1.2em;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:5px}embed{width:100%;height:800px;border:1px solid #ccc}.ms-embed{width:100%;height:800px;border:1px solid #aaa;margin-top:10px}</style></head><body><h1>Filtered PDF Report</h1>`;
          
          let msFound = 0;
          let msNotFound = 0;

          for (const r of rows) {
            const fname = r.filename;
            const year = r.year;
            const mainTopic = r.mainTopic;
            let msUrl = '';
            
            if (msEnabled) {
              const msFile = getMSFilename(fname);
              const fullMsUrl = `${pdfBaseUrl}${year}/${msFile}`;
              
              const msExists = await checkMSFileExists(fullMsUrl);
              if (msExists) {
                msUrl = fullMsUrl;
                msFound++;
              } else {
                msNotFound++;
              }
            }
            
            html += `
              <div class='pdf-section'>
                <div class='header-row'>
                  <b>${fname}</b> <span style="color:#666; font-size:0.9em;">(${mainTopic})</span>
                </div>
                <embed src='${pdfBaseUrl}${year}/${fname}' type='application/pdf' />
                ${msUrl ? `<div style="margin-top:10px;font-weight:bold;color:#0066cc;">Mark Scheme</div><embed class="ms-embed" src='${msUrl}' type='application/pdf' />` : ''}
              </div>
            `;
          }
          html += '</body></html>';
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
          a.download = 'report.html';
          a.click();
          
          if (msEnabled) {
            showToast(`✅ HTML report generated with ${rows.length} files (${msFound} MS found, ${msNotFound} MS missing)`, 'success', 4000);
          } else {
            showToast(`✅ HTML report generated with ${rows.length} files`, 'success', 3000);
          }
        }

        async function mergePDFs() {
          hideTooltip();
          const rows = getSelectedRows();
          if (rows.length === 0) {
            showToast("No files selected. Please check the boxes for files you want to include.", 'warning', 4000);
            return;
          }
          if (rows.length > 50 && !confirm(`Merging ${rows.length} PDFs is memory intensive and may crash your browser. Continue?`))
            return;

          const mergeBtn = document.getElementById('merge-pdf-btn');
          mergeBtn.textContent = "⏳";
          mergeBtn.disabled = true;

          try {
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            const mergedPdf = await PDFDocument.create();
            const font = await mergedPdf.embedFont(StandardFonts.HelveticaBold);
            const pdfBaseUrl = `https://sialaichai.github.io/physics9702/${PDF_FOLDER}/`;

            let msFound = 0;
            let msNotFound = 0;

            for (let i = 0; i < rows.length; i++) {
              const r = rows[i];
              const fname = r.filename;
              const year = r.year;
              mergeBtn.textContent = `${i+1}/${rows.length}`;

              const fileUrl = `${pdfBaseUrl}${year}/${fname}`;
              const res = await fetch(fileUrl);
              if (!res.ok) {
                console.error(`Failed to fetch ${fname}`);
                continue;
              }

              const existingPdfBytes = await res.arrayBuffer();
              const sourcePdf = await PDFDocument.load(existingPdfBytes);

              const firstPage = sourcePdf.getPages()[0];
              const { width } = firstPage.getSize();
              const bannerPage = mergedPdf.addPage([width, 30]);
              bannerPage.drawText(`File: ${fname}`, {
                x: 15,
                y: 15,
                size: 12,
                font: font,
                color: rgb(1, 0, 0)
              });

              const copiedPages = await mergedPdf.copyPages(sourcePdf, sourcePdf.getPageIndices());
              copiedPages.forEach((page) => mergedPdf.addPage(page));

              if (msEnabled) {
                const msFile = getMSFilename(fname);
                const msUrl = `${pdfBaseUrl}${year}/${msFile}`;
                const msRes = await fetch(msUrl);
                if (msRes.ok) {
                  const msBytes = await msRes.arrayBuffer();
                  const msPdf = await PDFDocument.load(msBytes);
                  const msBanner = mergedPdf.addPage([width, 30]);
                  msBanner.drawText(`Mark Scheme: ${msFile}`, {
                    x: 15,
                    y: 15,
                    size: 12,
                    font: font,
                    color: rgb(0, 0, 1)
                  });
                  const msPages = await mergedPdf.copyPages(msPdf, msPdf.getPageIndices());
                  msPages.forEach((page) => mergedPdf.addPage(page));
                  msFound++;
                } else {
                  msNotFound++;
                }
              }
            }

            mergeBtn.textContent = "💾";
            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `merged_physics_linear_${new Date().toISOString().slice(0,10)}.pdf`;
            link.click();
            
            if (msEnabled) {
              showToast(`✅ Merged ${rows.length} files (${msFound} MS found, ${msNotFound} MS missing)`, 'success', 4000);
            } else {
              showToast(`✅ Merged ${rows.length} files`, 'success', 3000);
            }
          } catch (err) {
            console.error(err);
            showToast(`Error merging: ${err.message}`, 'error', 5000);
          } finally {
            mergeBtn.textContent = '📑';
            mergeBtn.disabled = false;
          }
        }

        async function downloadZIP() {
          hideTooltip();
          const rows = getSelectedRows();
          
          if (rows.length === 0) {
            showToast("No files selected. Please check the boxes for files you want to include.", 'warning', 4000);
            return;
          }
          if (rows.length > 100 && !confirm(`Zipping ${rows.length} files might take a while. Continue?`)) return;

          const zipBtn = document.getElementById('download-zip-btn');
          zipBtn.disabled = true;

          try {
            const zip = new JSZip();
            const pdfBaseUrl = `https://sialaichai.github.io/physics9702/${PDF_FOLDER}/`;

            let msFound = 0;
            let msNotFound = 0;

            for (let i = 0; i < rows.length; i++) {
              const r = rows[i];
              const fname = r.filename;
              const year = r.year;

              zipBtn.textContent = `${i+1}/${rows.length}`;

              const fileUrl = `${pdfBaseUrl}${year}/${fname}`;
              const res = await fetch(fileUrl);
              if (res.ok) {
                const blob = await res.blob();
                zip.file(fname, blob);
              } else {
                console.error(`Failed to fetch ${fname}`);
              }

              if (msEnabled) {
                const msFile = getMSFilename(fname);
                const msUrl = `${pdfBaseUrl}${year}/${msFile}`;
                const msRes = await fetch(msUrl);
                if (msRes.ok) {
                  const msBlob = await msRes.blob();
                  zip.file(msFile, msBlob);
                  msFound++;
                } else {
                  msNotFound++;
                }
              }
            }

            zipBtn.textContent = "📦";
            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `9702_papers_${new Date().toISOString().slice(0,10)}.zip`;
            link.click();
            URL.revokeObjectURL(link.href);

            if (msEnabled) {
              showToast(`✅ Zipped ${rows.length} files (${msFound} MS found, ${msNotFound} MS missing)`, 'success', 4000);
            } else {
              showToast(`✅ Zipped ${rows.length} files`, 'success', 3000);
            }

          } catch (err) {
            console.error(err);
            showToast(`Error creating zip: ${err.message}`, 'error', 5000);
          } finally {
            zipBtn.textContent = '📦';
            zipBtn.disabled = false;
          }
        }
      }

      // Filter state variables (declared before use)
      let selectedTopics = new Set();
      let selectedYears = new Set();
      let selectedPapers = new Set();
      let selectedQuestions = new Set();
      let selectedLevels = new Set();
      let selectedDifficulties = new Set();

      function applyFilters(data) {
        // Clear selection when filters change
        selectedRowFilenames.clear();
        selectAllCheckbox.checked = false;
        currentPage = 1;

        let fd = [...data];

        if (selectedTopics.size > 0) {
          const includeOther = document.getElementById('include-other-topics').checked;
          fd = fd.filter(item => {
            if (selectedTopics.has(item.mainTopic)) return true;
            if (includeOther && item.otherTopics.some(t => selectedTopics.has(t))) return true;
            return false;
          });
        }

        if (selectedYears.size > 0)
          fd = fd.filter(i => selectedYears.has(i.year));
        if (selectedPapers.size > 0)
          fd = fd.filter(i => selectedPapers.has(i.paper));
        if (selectedQuestions.size > 0)
          fd = fd.filter(i => selectedQuestions.has(i.question));
        
        if (selectedLevels.size > 0) {
          fd = fd.filter(i => selectedLevels.has(i.level));
          debugLog(`🔍 Filtering by MCQ levels: ${Array.from(selectedLevels).join(', ')} - Found ${fd.length} items`);
        }

        if (selectedDifficulties.size > 0) {
          fd = fd.filter(i => {
            const diff = p2p3DataMap[i.filename]?.overall_difficulty || 0;
            const cat = getDifficultyCategory(diff).label.toLowerCase();
            return selectedDifficulties.has(cat);
          });
          debugLog(`🔍 Filtering by P2/P3 difficulty: ${Array.from(selectedDifficulties).join(', ')} - Found ${fd.length} items`);
        }

        currentFilteredData = fd;
        renderTable(currentFilteredData);
      }

      // Tooltip functions (unchanged)
      function showTooltip(e, data) {
        const filename = data.filename || 'Unknown';
        const diff = data.overall_difficulty || 0;
        const category = getDifficultyCategory(diff);
        
        tooltipFilename.textContent = filename;
        tooltipDiffBadge.textContent = `${category.label}: ${diff.toFixed(2)}`;
        tooltipDiffBadge.className = `diff-badge ${category.class}`;
        
        let contentHtml = '';
        contentHtml += `
          <div class="tooltip-summary">
            <span>📝 Marks: <strong>${data.total_marks || 0}</strong></span>
            <span>📊 Parts: <strong>${data.parts ? data.parts.length : 0}</strong></span>
            <span>⚖️ Weighted: <strong>${data.weighted_sum || 0}</strong></span>
            <span>⭐ Difficulty: <strong>${diff.toFixed(2)}</strong></span>
          </div>
        `;
        if (data.parts && data.parts.length > 0) {
          contentHtml += `<div class="tooltip-section-label">📋 Part Breakdown</div>`;
          contentHtml += `<div style="max-height:200px;overflow-y:auto;">`;
          data.parts.forEach(p => {
            const levelNum = parseInt(p.level) || 1;
            const levelColor = ['#28a745', '#17a2b8', '#fd7e14', '#dc3545', '#6f42c1'][levelNum - 1] || '#888';
            contentHtml += `
              <div class="tooltip-part">
                <span class="part-label">${p.part || '?'}</span>
                <span class="part-desc">${p.description || ''}</span>
                <span class="part-level" style="color:${levelColor};">L${p.level || '?'}</span>
                <span class="part-marks">${p.marks || 0}m</span>
              </div>
            `;
          });
          contentHtml += `</div>`;
        } else {
          contentHtml += `<div style="color:#888;font-size:11px;margin-top:4px;">No part details available</div>`;
        }
        tooltipContent.innerHTML = contentHtml;
        
        const x = e.clientX + 15;
        const y = e.clientY + 10;
        const tw = Math.min(450, window.innerWidth - 40);
        const th = Math.min(400, window.innerHeight - 40);
        const tx = Math.min(x, window.innerWidth - tw - 10);
        const ty = Math.min(y, window.innerHeight - th - 10);
        
        tooltip.style.display = 'block';
        tooltip.style.left = tx + 'px';
        tooltip.style.top = ty + 'px';
        tooltip.style.maxWidth = tw + 'px';
        tooltip.style.maxHeight = th + 'px';
      }

      function hideTooltip() {
        tooltip.style.display = 'none';
      }

      // ---- RENDER TABLE with pagination ----
      function renderTable(data) {
        // Sort
        const keys = ['', 'filename', 'year', 'paper', 'question', 'mainTopic', 'otherTopics', 'level'];
        const sortKey = keys[currentSort.column];
        data.sort((a, b) => {
          let valA = a[sortKey] || '';
          let valB = b[sortKey] || '';
          if (sortKey === 'year') {
            valA = parseInt(valA.toString().replace(/\D/g, '')) || 0;
            valB = parseInt(valB.toString().replace(/\D/g, '')) || 0;
            return currentSort.asc ? valA - valB : valB - valA;
          }
          if (sortKey === 'otherTopics') {
            valA = valA.join(', ');
            valB = valB.join(', ');
          }
          if (sortKey === 'level') {
            if (!valA && !valB) return 0;
            if (!valA) return 1;
            if (!valB) return -1;
          }
          return currentSort.asc
            ? String(valA).localeCompare(String(valB), undefined, { numeric: true, sensitivity: 'base' })
            : String(valB).localeCompare(String(valA), undefined, { numeric: true, sensitivity: 'base' });
        });

        // Pagination calculations
        totalPages = Math.max(1, Math.ceil(data.length / rowsPerPage));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        const start = (currentPage - 1) * rowsPerPage;
        const end = Math.min(start + rowsPerPage, data.length);
        const pageData = data.slice(start, end);

        // Update pagination controls
        prevPageBtn.disabled = (currentPage <= 1);
        nextPageBtn.disabled = (currentPage >= totalPages);
        pageInfoSpan.textContent = `Page ${currentPage} of ${totalPages} (${data.length} items)`;

        // Build table rows
        const fragment = document.createDocumentFragment();
        pageData.forEach(r => {
          const tr = document.createElement('tr');
          tr.setAttribute('data-filename', r.filename);

          // Check if this item has P2/P3 difficulty data
          const p2p3Info = p2p3DataMap[r.filename];
          const isP2P3 = !!p2p3Info;

          const isChecked = selectedRowFilenames.has(r.filename);

          let levelDisplay = '';
          let rowClass = '';
          let hoverClass = '';

          if (isP2P3) {
            const diff = p2p3Info.overall_difficulty || 0;
            const category = getDifficultyCategory(diff);
            levelDisplay = `
              <span class="difficulty-badge ${category.class}" 
                    data-filename="${r.filename}"
                    data-has-details="true"
                    style="cursor:help; display:inline-block; padding:1px 8px; border-radius:12px; font-size:10px; font-weight:bold; color:white; text-shadow:0 1px 1px rgba(0,0,0,0.2); text-align:center; min-width:60px; white-space:nowrap;">
                ${category.label}: ${diff.toFixed(2)}
              </span>
            `;
            rowClass = category.rowClass;
            hoverClass = category.hoverClass;
          } else if (r.level && ['1','2','3','4','5'].includes(r.level)) {
            rowClass = `level-row-${r.level}`;
            const levelLabels = {
              '1': 'L1',
              '2': 'L2', 
              '3': 'L3',
              '4': 'L4',
              '5': 'L5'
            };
            levelDisplay = `<span class="level-badge level-${r.level}">${levelLabels[r.level]}</span>`;
            tr.addEventListener('mouseenter', () => {
              tr.className = `level-row-hover-${r.level}`;
            });
            tr.addEventListener('mouseleave', () => {
              tr.className = rowClass;
            });
          } else {
            levelDisplay = '<span style="color:#999;font-size:10px;">—</span>';
          }

          if (rowClass) {
            tr.className = rowClass;
            if (hoverClass) {
              tr.addEventListener('mouseenter', () => {
                tr.className = hoverClass;
              });
              tr.addEventListener('mouseleave', () => {
                tr.className = rowClass;
              });
            }
          }

          tr.innerHTML = `
            <td><input type="checkbox" class="row-checkbox" ${isChecked ? 'checked' : ''} /></td>
            <td>${r.filename}</td>
            <td>${r.year}</td>
            <td>${r.paper}</td>
            <td>${r.question}</td>
            <td>${r.mainTopic}</td>
            <td>${r.otherTopics.join(', ')}</td>
            <td>${levelDisplay}</td>
          `;

          // Checkbox change: update selection set
          const checkbox = tr.querySelector('.row-checkbox');
          checkbox.addEventListener('change', function() {
            if (this.checked) {
              selectedRowFilenames.add(r.filename);
            } else {
              selectedRowFilenames.delete(r.filename);
            }
            // Update select-all state based on visible rows
            const visibleCheckboxes = tableBody.querySelectorAll('.row-checkbox');
            const checkedVisible = tableBody.querySelectorAll('.row-checkbox:checked');
            selectAllCheckbox.checked = (visibleCheckboxes.length === checkedVisible.length);
          });

          // P2/P3 tooltip
          if (isP2P3) {
            const levelCell = tr.querySelector('td:last-child');
            levelCell.addEventListener('mouseenter', (e) => {
              showTooltip(e, {
                filename: r.filename,
                parts: p2p3Info.parts || [],
                total_marks: p2p3Info.total_marks || 0,
                weighted_sum: p2p3Info.weighted_sum || 0,
                overall_difficulty: p2p3Info.overall_difficulty || 0
              });
            });
            levelCell.addEventListener('mousemove', (e) => {
              if (tooltip.style.display === 'block') {
                const x = e.clientX + 15;
                const y = e.clientY + 10;
                const tw = Math.min(450, window.innerWidth - 40);
                const th = Math.min(400, window.innerHeight - 40);
                const tx = Math.min(x, window.innerWidth - tw - 10);
                const ty = Math.min(y, window.innerHeight - th - 10);
                tooltip.style.left = tx + 'px';
                tooltip.style.top = ty + 'px';
              }
            });
            levelCell.addEventListener('mouseleave', (e) => {
              if (!tooltip.contains(e.relatedTarget)) {
                hideTooltip();
              }
            });
          }

          // Click row to load PDF
          tr.addEventListener('click', (e) => {
            if (e.target.type === 'checkbox') return;
            if (tooltip.contains(e.target)) return;
            const pdfBaseUrl = `https://sialaichai.github.io/physics9702/${PDF_FOLDER}/`;
            const pdfUrl = `${pdfBaseUrl}${r.year}/${r.filename}`;
            pdfViewer.src = pdfUrl;
            pdfViewer.style.flex = '1';
            lastNotifiedFile = '';
            if (msEnabled) {
              loadMSFile(r.filename, `${pdfBaseUrl}${r.year}/`);
            } else {
              msViewer.src = '';
              msViewer.style.display = 'none';
              pdfViewer.style.flex = '1';
            }
          });
          fragment.appendChild(tr);
        });

        tableBody.innerHTML = '';
        tableBody.appendChild(fragment);

        // Update file count display
        fileCountDisplay.textContent = `${data.length} files`;

        // Update filter counts
        const yearCount = new Set(data.map(i => i.year)).size;
        const paperCount = new Set(data.map(i => i.paper)).size;
        const questionCount = new Set(data.map(i => i.question)).size;
        const topicCount = new Set(data.map(i => i.mainTopic)).size;
        const levelCount = data.filter(i => i.level && ['1','2','3','4','5'].includes(i.level)).length;
        const diffCount = data.filter(i => p2p3DataMap[i.filename]).length;
        
        document.querySelector('#year-filter-btn span').textContent = yearCount;
        document.querySelector('#paper-filter-btn span').textContent = paperCount;
        document.querySelector('#question-filter-btn span').textContent = questionCount;
        document.querySelector('#topic-filter-btn span').textContent = topicCount;
        document.querySelector('#level-filter-btn span').textContent = levelCount;
        document.querySelector('#difficulty-filter-btn span').textContent = diffCount;
      }

      // Dragger logic (unchanged)
      const dragger = document.getElementById('dragger');
      const lowerPanel = document.getElementById('lower-panel');
      if (dragger && lowerPanel) {
        let isDragging = false;
        dragger.addEventListener('mousedown', () => {
          hideTooltip();
          isDragging = true;
          document.body.style.userSelect = 'none';
          if (pdfViewer) pdfViewer.style.pointerEvents = 'none';
        });
        document.addEventListener('mouseup', () => {
          isDragging = false;
          document.body.style.userSelect = 'auto';
          if (pdfViewer) pdfViewer.style.pointerEvents = 'auto';
        });
        document.addEventListener('mousemove', (e) => {
          if (isDragging)
            lowerPanel.style.height = `${window.innerHeight - e.clientY - 2.5}px`;
        });
      }

      // Hide tooltip on click/scroll/resize
      document.addEventListener('click', (e) => {
        if (!tooltip.contains(e.target)) {
          hideTooltip();
        }
      });
      document.addEventListener('scroll', hideTooltip);
      window.addEventListener('resize', hideTooltip);

      // Return API
      return {
        updateData: function(newData) {
          processedData = newData;
          currentFilteredData = [...processedData];
          selectedRowFilenames.clear();
          selectAllCheckbox.checked = false;
          currentPage = 1;
          populateDropdowns(processedData);
          renderTable(currentFilteredData);
          debugLog(`🔄 Data updated: ${processedData.length} items`);
        },
        updateP2P3Data: function(diffMap) {
          p2p3DataMap = diffMap;
          debugLog(`🔄 P2/P3 data updated: ${Object.keys(p2p3DataMap).length} entries`);
          // Re-render current page
          renderTable(currentFilteredData);
          const diffCount = currentFilteredData.filter(i => p2p3DataMap[i.filename]).length;
          document.querySelector('#difficulty-filter-btn span').textContent = diffCount;
        }
      };
    }
  </script>
</body>
</html>
